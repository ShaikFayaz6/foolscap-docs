# Replace the app name with a globally unique one before the first deploy.
# SQLite lives on one volume, so run exactly one machine: fly deploy --ha=false
app = "foolscap-docs"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/foolscap.db"

[mounts]
  source = "foolscap_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Render Blueprint. A persistent disk needs a paid instance type; without one,
# the SQLite file would be erased on every deploy and restart.
services:
  - type: web
    name: foolscap
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/foolscap.db
    disk:
      name: foolscap-data
      mountPath: /data
      sizeGB: 1
